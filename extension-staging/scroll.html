<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JW Scroll</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0d0e13; color: #eaeefc; font: 13px "Segoe UI", system-ui, sans-serif; overflow: hidden; }
    .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; box-sizing: border-box; text-align: center;
      background: radial-gradient(80% 50% at 20% 10%, rgba(37, 244, 238, .16), transparent 60%), radial-gradient(80% 50% at 80% 90%, rgba(254, 44, 85, .16), transparent 60%), #0d0e13; }
    .logo { width: 74px; height: 74px; border-radius: 20px; display: grid; place-items: center; background: #000;
      box-shadow: -4px -3px 0 #25f4ee, 4px 3px 0 #fe2c55, 0 14px 40px -10px rgba(254, 44, 85, .6); animation: bob 3s ease-in-out infinite; }
    .logo svg { width: 40px; height: 40px; }
    h1 { margin: 0; font-size: 20px; letter-spacing: .3px; }
    p { margin: 0; color: #9aa1b5; max-width: 280px; line-height: 1.5; }
    button { border: none; cursor: pointer; font: 700 14px "Segoe UI", sans-serif; color: #fff; padding: 12px 26px; border-radius: 12px;
      background: linear-gradient(100deg, #fe2c55, #ff5a7a); box-shadow: 0 10px 26px -10px rgba(254, 44, 85, .9); transition: transform .2s, box-shadow .2s; }
    button:hover { transform: translateY(-2px); box-shadow: 0 14px 30px -10px rgba(254, 44, 85, 1); }
    label { color: #9aa1b5; font-size: 12px; display: flex; gap: 8px; align-items: center; cursor: pointer; }
    small { color: #6c7286; font-size: 11px; max-width: 280px; }
    @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-6px) rotate(3deg); } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <svg viewBox="0 0 48 48"><path fill="#fff" d="M33 6c.6 4.6 3.6 7.6 8 8v6c-2.9.1-5.6-.8-8-2.4V31c0 6.9-5.6 12-12.2 11.4C14.6 41.8 10 36.4 10.6 30.2 11.2 24 16.9 19.5 23 20.4v6.3c-2.7-.8-5.6 1-6.1 3.8-.5 3 1.8 5.7 4.8 5.7 2.7 0 4.9-2.2 4.9-4.9V6h6.4z"/></svg>
    </div>
    <h1>Doomscroll break</h1>
    <p>TikTok right inside After Effects. Dock this panel next to your timeline and scroll while renders run.</p>
    <button id="go">Start scrolling</button>
    <small>Close and reopen this panel (Window &gt; Extensions) to come back to this screen.</small>
  </div>
  <script>
    (function () {
      var URL = "https://www.tiktok.com/foryou";
      // TikTok only loads when you click, so opening After Effects never starts a video by itself
      try { localStorage.removeItem("jwscroll.auto"); } catch (e) {}
      document.getElementById("go").addEventListener("click", function () { location.href = URL; });
    })();
  </script>
</body>
</html>
